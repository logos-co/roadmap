name: Verify Build

on:
  push:
    branches: [v4, v5]
  pull_request:
    branches: [v4, v5]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npx quartz plugin install

      - name: Build project
        run: npx quartz build

      - name: Run tests
        run: npm test
